name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            testbench: '^6.0'
          - php: '8.0'
            testbench: '^6.0'
          - php: '8.1'
            testbench: '^7.0'
          - php: '8.2'
            testbench: '^8.0'
          - php: '8.3'
            testbench: '^9.0'
          - php: '8.3'
            testbench: '^10.0'

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
